<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>News Portal</title>
    </head>
    <body>
        <header>
            <div class="header-container">
                <h1>News Portal</h1>
            </div>
        </header>
        
        <main class="main-container">

            <div class="sources buttons"></div>

            <div class="news"></div>
        </main>

        <footer>
            <div class="footer-container">
                <div class="footer-data">
                    <p class="year">2026</p>
                    <a class="github-link" href="https://github.com/AlexDesperate" target="_blank" rel="noopener noreferrer">My GitHub</a>
                </div>
                <a class="rs-logo" href="https://rs.school/courses/javascript" target="_blank" rel="noopener noreferrer">
                    <img src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg" alt="RS School Logo" width="100">
                </a>
            </div>
        </footer>


        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>


        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#" target="_blank">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
